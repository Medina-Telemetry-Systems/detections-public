title: Veeam Backup Credential Dump Via PowerShell (INC Ransom)
id: 9eaf0cca-dcbf-47f1-bd77-fe158686d108
status: experimental
description: |
  Detects a PowerShell script that reads the Credentials table of the Veeam Backup configuration database and decrypts the
  stored passwords with DPAPI (ProtectedData Unprotect). INC Ransom affiliates ran a modified version of the open-source
  Veeam-Get-Creds.ps1 script this way, launched as encoded PowerShell. Script block logging records the decoded script.
references:
  - https://www.acronis.com/en/tru/posts/from-emerging-threat-to-top-tier-ransomware-as-a-service-the-evolution-of-inc-ransomware/
author: Medina Telemetry Systems
date: 2026-11-16
license: DRL-1.1
tags:
  - attack.credential-access
  - attack.t1555
logsource:
  product: windows
  category: ps_script
  definition: 'Requires PowerShell Script Block Logging (event 4104).'
detection:
  selection:
    ScriptBlockText|contains|all:
      - '[dbo].[Credentials]'
      - 'ProtectedData]::Unprotect'
  condition: selection
falsepositives:
  - Backup administrators or penetration testers running the same open-source script on purpose. Any other actor using it
    also matches, which is intended.
level: high
